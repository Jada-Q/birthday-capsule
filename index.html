<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>birthday capsule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload cake painting so it's decoded before main.ts mounts the DOM -->
    <link rel="preload" as="image" href="/assets/cake-painted.png" fetchpriority="high" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Ambient gold-foil balloons (pre-blow: 2 sparse; post-blow: 6 fast — populated by main.ts) -->
    <div id="balloons" aria-hidden="true"></div>

    <main id="app">
      <header class="page-header">
        <div class="wordmark">
          <span class="wordmark__row">birthday</span>
          <span class="wordmark__pip"></span>
          <span class="wordmark__row">capsule</span>
        </div>
        <div class="header-meta" id="header-meta">
          <div id="header-meta-mode">DAILY MODE</div>
          <div class="header-meta__sub" id="header-meta-sub">may 19 · 2026 · the cake won't go out today</div>
        </div>
      </header>

      <section id="stage" class="page-stage">
        <!-- Cake painting + age digit (rendered by main.ts based on scene) -->
        <div id="cake-mount"></div>
        <!-- Transient UI: button / status / hero copy (rendered by main.ts) -->
        <div id="ui"></div>
      </section>

      <footer class="page-footer">
        <span id="footer-text">come back on may 20 · 247 days to go</span>
        <span class="page-footer__right">JADA-Q / BIRTHDAY-CAPSULE</span>
      </footer>
    </main>

    <video id="cam" autoplay playsinline muted style="display:none"></video>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
