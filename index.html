<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 birthday capsule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Caveat:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Paper grain overlay (SVG noise) -->
    <div class="paper-grain" aria-hidden="true"></div>

    <!-- Dense doodle wallpaper — 20 scatter symbols -->
    <div class="scatter s1"  aria-hidden="true">✦</div>
    <div class="scatter s2"  aria-hidden="true">❤</div>
    <div class="scatter s3"  aria-hidden="true">★</div>
    <div class="scatter s4"  aria-hidden="true">✿</div>
    <div class="scatter s5"  aria-hidden="true">♡</div>
    <div class="scatter s6"  aria-hidden="true">◆</div>
    <div class="scatter s7"  aria-hidden="true">✸</div>
    <div class="scatter s8"  aria-hidden="true">●</div>
    <div class="scatter s9"  aria-hidden="true">✿</div>
    <div class="scatter s10" aria-hidden="true">▲</div>
    <div class="scatter s11" aria-hidden="true">✦</div>
    <div class="scatter s12" aria-hidden="true">❤</div>
    <div class="scatter s13" aria-hidden="true">★</div>
    <div class="scatter s14" aria-hidden="true">✿</div>
    <div class="scatter s15" aria-hidden="true">●</div>
    <div class="scatter s16" aria-hidden="true">◆</div>
    <div class="scatter s17" aria-hidden="true">✦</div>
    <div class="scatter s18" aria-hidden="true">❤</div>
    <div class="scatter s19" aria-hidden="true">★</div>
    <div class="scatter s20" aria-hidden="true">✿</div>

    <!-- Handwritten phrase scatter -->
    <div class="phrase p1" aria-hidden="true">LITTLE<br/>THINGS</div>
    <div class="phrase p2" aria-hidden="true">HOO!</div>
    <div class="phrase p3" aria-hidden="true">FOR<br/>YOU</div>
    <div class="phrase p4" aria-hidden="true">ENJOY ✦</div>

    <!-- Dash-line accents ("stink lines") -->
    <svg class="dash d1" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="2" y1="7" x2="8" y2="7"/><line x1="14" y1="7" x2="20" y2="7"/><line x1="26" y1="7" x2="32" y2="7"/></g></svg>
    <svg class="dash d2" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="2" y1="7" x2="8" y2="7"/><line x1="14" y1="7" x2="20" y2="7"/><line x1="26" y1="7" x2="32" y2="7"/></g></svg>
    <svg class="dash d3" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="2" y1="7" x2="8" y2="7"/><line x1="14" y1="7" x2="20" y2="7"/><line x1="26" y1="7" x2="32" y2="7"/></g></svg>
    <svg class="dash d4" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="2" y1="7" x2="8" y2="7"/><line x1="14" y1="7" x2="20" y2="7"/><line x1="26" y1="7" x2="32" y2="7"/></g></svg>

    <header class="page-header">
      <h1 class="wordmark">
        <span class="wordmark__top">birthday</span>
        <span class="wordmark__bot">capsule</span>
      </h1>
      <p class="tagline">a once-a-year ritual</p>
    </header>

    <main id="app">
      <div class="cake-stage">
        <canvas id="stage" width="640" height="640"></canvas>
      </div>
      <div id="ui"></div>
      <video id="cam" autoplay playsinline muted style="display:none"></video>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
