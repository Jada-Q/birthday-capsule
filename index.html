<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 birthday capsule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Caveat:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Paper grain overlay (SVG noise) -->
    <div class="paper-grain" aria-hidden="true"></div>

    <!-- Doodle scatter — bold, max colors, max angles -->
    <div class="scatter scatter--tl" aria-hidden="true">✦</div>
    <div class="scatter scatter--tr" aria-hidden="true">❤</div>
    <div class="scatter scatter--bl" aria-hidden="true">✿</div>
    <div class="scatter scatter--br" aria-hidden="true">★</div>
    <div class="scatter scatter--top-mid" aria-hidden="true">✸</div>
    <div class="scatter scatter--left-mid" aria-hidden="true">●</div>
    <div class="scatter scatter--right-mid" aria-hidden="true">◆</div>
    <div class="scatter scatter--bot-mid" aria-hidden="true">·  ·  ·</div>

    <!-- Sunburst speech bubbles — comic-book pop -->
    <div class="sunburst sunburst--top-right" aria-hidden="true">YAY!</div>
    <div class="sunburst sunburst--bot-left" aria-hidden="true">OH!</div>

    <header class="page-header">
      <h1 class="wordmark">
        <span class="wordmark__top">birthday</span>
        <span class="wordmark__bot">capsule</span>
      </h1>
      <p class="tagline">a once-a-year ritual</p>
    </header>

    <main id="app">
      <div class="cake-stage">
        <canvas id="stage" width="640" height="640"></canvas>
      </div>
      <div id="ui"></div>
      <video id="cam" autoplay playsinline muted style="display:none"></video>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
